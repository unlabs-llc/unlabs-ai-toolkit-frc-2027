    note: >-
      The deploy gate was withdrawn before release because of its design, not because of a defect count.
      The command layer cannot carry a deploy guarantee -- text does not reliably represent what will
      execute. v1.0 therefore ships NO deploy guarantee, stated plainly, plus frc-pre-deploy as a
      validation skill a team invokes. The verdict contract and staleness mechanism were rated sound
      and are retained for a future attempt at a different enforcement boundary.

